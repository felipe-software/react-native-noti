plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.notificationmotion'
version = '0.1.0'
android {
  namespace 'expo.modules.notificationmotion'
  defaultConfig {
    minSdkVersion 31
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'src/main/cpp/consumer-rules.pro'
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_static'
      }
    }
  }
  externalNativeBuild {
    cmake {
      path file('src/main/cpp/CMakeLists.txt')
      version '3.22.1'
    }
  }
}
dependencies {
  implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'
}
